services:
  mysql:
    image: mysql:8.0
    container_name: cvextract-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cvextract}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    # Không pin version vì volume data hiện đang ở format newer (Qdrant >=v1.13)
    # Pin xuống version cũ sẽ panic do schema mismatch
    image: qdrant/qdrant:latest
    container_name: cvextract-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # 9Router là TÙY CHỌN: chỉ build + chạy khi bật profile `router9`.
  # docker compose --profile router9 up -d --build
  router9:
    profiles: ["router9"]
    build:
      context: .
      target: router9
    container_name: cvextract-9router
    restart: unless-stopped
    ports:
      - "20128:20128"           # dashboard UI từ host
    volumes:
      - router9_data:/data      # persist API keys + combos + provider creds
    healthcheck:
      # node:20-slim không có wget/curl, dùng http module built-in của node
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:20128/v1/models',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  app:
    build:
      context: .
      target: app
    container_name: cvextract-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-cvextract}
      QDRANT_URL: http://qdrant:6333
      # Override được qua .env. Khi bật profile router9 trong cùng compose: dùng tên service `router9`.
      # Khi chạy 9router ngoài compose: trỏ tới host, vd http://host.docker.internal:20128/v1
      ROUTER9_BASE_URL: ${ROUTER9_BASE_URL:-http://router9:20128/v1}
      CV_RAW_TEXT_DIR: ./tests/extraction/raw_txt
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./logs:/app/logs
      - ./tests/extraction/raw_txt:/app/tests/extraction/raw_txt
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
  qdrant_storage:
  router9_data:
  hf_cache:
